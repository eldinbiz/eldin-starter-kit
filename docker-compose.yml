services:
  app:
    build: .
    container_name: laravel-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html       # live code (hot reload)
      - /var/www/html/vendor  # keep container's vendor
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - laravel

  mariadb:
    image: mariadb:11
    container_name: laravel-mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - laravel
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  queue:
    build: .
    container_name: laravel-queue
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - laravel
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=3

  vite:
    image: node:22-alpine
    container_name: laravel-vite
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    ports:
      - "5173:5173"
    networks:
      - laravel
    command: sh -c "npm install && npx vite --host 0.0.0.0"

networks:
  laravel:

volumes:
  mariadb_data:
