services:
  # ===== PHP-FPM Application =====
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: laravel-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      AUTO_MIGRATE: "false"
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - app_public:/var/www/html/public
      - app_storage:/var/www/html/storage
    networks:
      - laravel

  # ===== Nginx Web Server =====
  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage
    depends_on:
      - app
    networks:
      - laravel

  # ===== MariaDB Database =====
  mariadb:
    image: mariadb:11
    container_name: laravel-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootpassword}"
      MYSQL_DATABASE: "${DB_DATABASE:-laravel}"
      MYSQL_USER: "${DB_USERNAME:-laravel}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-laravel}"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - laravel
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===== Queue Worker =====
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: laravel-queue
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      AUTO_MIGRATE: "false"
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - app_public:/var/www/html/public
      - app_storage:/var/www/html/storage
    networks:
      - laravel
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=3
    deploy:
      replicas: 1

networks:
  laravel:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
  app_public:
    driver: local
  app_storage:
    driver: local
