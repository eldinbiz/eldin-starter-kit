# Development overrides - extends docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  # ===== PHP-FPM Application (Dev) =====
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: laravel-app-dev
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      AUTO_MIGRATE: "true"
    volumes:
      # Bind mount entire project for hot reload
      - .:/var/www/html
      # Exclude vendor from bind mount (use container's composer-installed vendor)
      - /var/www/html/vendor
      - /var/www/html/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ===== Nginx (Dev) =====
  nginx:
    container_name: laravel-nginx-dev
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Bind mount public for dev (hot reload assets)
      - ./public:/var/www/html/public:ro
      - ./storage:/var/www/html/storage

  # ===== MariaDB (Dev) - expose port to host =====
  mariadb:
    container_name: laravel-mariadb-dev
    ports:
      - "3306:3306"

  # ===== Queue Worker (Dev) =====
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: laravel-queue-dev
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      AUTO_MIGRATE: "false"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=3

  # ===== Vite Dev Server with HMR =====
  vite:
    image: node:22-alpine
    container_name: laravel-vite-dev
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    ports:
      - "5173:5173"
    environment:
      VITE_APP_URL: "${APP_URL:-http://localhost}"
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - laravel
