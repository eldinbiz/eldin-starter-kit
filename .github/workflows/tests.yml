name: Tests

on:
  workflow_dispatch:
    inputs:
      publish_badges:
        description: 'Publish badge JSON even when run outside main branch'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

defaults:
  run:
    working-directory: starter-kit

jobs:
  tests:
    name: Pest Test Suite (PHP 8.4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout starter kit
        uses: actions/checkout@v4
        with:
          path: starter-kit

      - name: Checkout laravel-rubberstamp sibling dependency
        uses: actions/checkout@v4
        with:
          repository: eldinbiz/laravel-rubberstamp
          path: laravel-rubberstamp

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, dom, curl, openssl, zip, gd, intl, bcmath, pdo, pdo_sqlite
          coverage: none

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment and Vite assets
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          php artisan config:clear --no-interaction
          php artisan view:clear --no-interaction

      - id: run_tests
        name: Run Pest test suite
        run: |
          set +e
          rm -f /tmp/junit.xml
          php artisan test --log-junit /tmp/junit.xml
          exit_code=$?
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Generate unit test badge JSON
        if: always()
        env:
          CHECK_EXIT_CODE: '${{ steps.run_tests.outputs.exit_code }}'
        run: |
          mkdir -p "${RUNNER_TEMP}/badges-out"
          php -r '
          $exitCode = (int) (getenv("CHECK_EXIT_CODE") !== "" ? getenv("CHECK_EXIT_CODE") : 1);
          $junitPath = "/tmp/junit.xml";
          $tests = 0;
          $failures = 0;
          $errors = 0;
          $skipped = 0;

          if (is_file($junitPath)) {
              $xml = @simplexml_load_file($junitPath);
              if ($xml !== false) {
                  $suites = $xml->xpath("/testsuites/testsuite");
                  if (empty($suites) && $xml->getName() === "testsuite") {
                      $suites = [$xml];
                  }
                  foreach ($suites ?: [] as $suite) {
                      $tests += (int) ($suite["tests"] ?? 0);
                      $failures += (int) ($suite["failures"] ?? 0);
                      $errors += (int) ($suite["errors"] ?? 0);
                      $skipped += (int) ($suite["skipped"] ?? 0);
                  }
              }
          }

          $failed = $failures + $errors;
          if ($exitCode === 0 && $failed === 0) {
              $passed = max(0, $tests - $failed - $skipped);
              $message = $tests > 0 ? "{$passed} passed" : "passing";
              $color = "#22c55e";
              $isError = false;
          } else {
              $message = $failed > 0 ? "{$failed} failed" : "failing";
              $color = "#ef4444";
              $isError = true;
          }

          $payload = [
              "schemaVersion" => 1,
              "label" => "Unit Test",
              "message" => $message,
              "color" => $color,
              "isError" => $isError,
          ];

          file_put_contents(
              getenv("RUNNER_TEMP") . "/badges-out/tests.json",
              json_encode($payload, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n"
          );
          echo "Generated tests.json: {$message} ({$color})\n";
          '

      - name: Publish unit test badge
        if: always() && (github.ref == 'refs/heads/main' || inputs.publish_badges == true)
        uses: ./starter-kit/.github/actions/publish-badge
        with:
          source_dir: '${{ runner.temp }}/badges-out'
          commit_message: 'chore(badges): update unit test badge'

      - name: Verify test outcome
        if: always()
        env:
          CHECK_EXIT_CODE: '${{ steps.run_tests.outputs.exit_code }}'
        run: |
          if [ "${CHECK_EXIT_CODE:-1}" -ne 0 ]; then
            echo "::error::Test suite failed with exit code ${CHECK_EXIT_CODE:-1}."
            exit "${CHECK_EXIT_CODE:-1}"
          fi
